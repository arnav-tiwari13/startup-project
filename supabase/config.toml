# Minimal config for deploying the advisor Edge Function with the Supabase CLI.
project_id = "pnouqpnadokuunxsmgsn"

[functions.advisor]
# The function verifies the signed-in user itself (auth.getUser) and enforces access with
# row-level security, so the gateway's own JWT check is turned off.
verify_jwt = false

[functions.table-data]
# Same pattern: the function verifies the signed-in user itself with auth.getUser.
verify_jwt = false

[functions.create-checkout]
# Same pattern: the function verifies the signed-in user itself with auth.getUser.
verify_jwt = false
